[workspace]

[package]
name = "radiowatch"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "radiowatch"
test = false
bench = false

[dependencies]
bf5rh-abi = { path = "../../abi" }
app-theme = { path = "../../app-theme" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
